<svg xmlns="http://www.w3.org/2000/svg" width="320" height="168" viewBox="0 0 320 168" role="img" aria-labelledby="sc-title">
  <title id="sc-title">Google position 4.8, page one, for a US buyer search for a US AI sales platform, up from 70.3. Google Search Console, 28-day average, 28 days to 4 Sep vs 26 Oct to 22 Nov 2026.</title>
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081530"/>
      <stop offset="1" stop-color="#0f2752"/>
    </linearGradient>
    <linearGradient id="sc-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".30"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sc-line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4b94ec"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .tag{font-size:10.5px;font-weight:700;letter-spacing:1.2px;fill:#8ab8ff}
    .val{font-size:42px;font-weight:800;letter-spacing:-1px;fill:#ffffff}
    .lab{font-size:14px;font-weight:600;fill:#d3e1f7}
    .dl{font-size:12.5px;font-weight:800;fill:#5eead4}
    .from{font-size:12px;font-weight:500;fill:#a9bddd}
    .src{font-size:11px;font-weight:500;fill:#7f93b5}
    .bl{font-size:9.5px;font-weight:700;fill:#a9bddd}
    .good{font-size:8.5px;font-weight:700;fill:#5eead4}
    .up{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
    .u2{animation-delay:.12s}.u3{animation-delay:.24s}.u4{animation-delay:.36s}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .spark{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s cubic-bezier(.45,0,.2,1) .4s both}
    @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    .area{animation:fade .8s ease 1.4s both}
    .dot{animation:fade .4s ease 1.7s both}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    .ping{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:ping 2.4s ease-out 1.9s infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
    @media (prefers-reduced-motion:reduce){.up,.spark,.area,.dot{animation:none}.ping{animation:none;opacity:0}}
  </style>
  <rect x=".5" y=".5" width="319" height="167" rx="16" fill="url(#sc-bg)" stroke="#23406f"/>
  <g class="f">
    <g class="up">
      <circle cx="24" cy="26" r="4" fill="#4b94ec"/>
      <text x="34" y="30" class="tag">AI SALES PLATFORM (US)</text>
    </g>
    <text x="20" y="80" class="val up u2">4.8</text>
    <text x="20" y="103" class="lab up u3">Google position, a US buyer search</text>
    <g class="up u4">
      <rect x="20" y="113" width="74" height="22" rx="11" fill="#0f766e" fill-opacity=".38" stroke="#2dd4bf" stroke-opacity=".55"/>
      <text x="57" y="128.5" class="dl" text-anchor="middle">Page one</text>
      <text x="103" y="128.5" class="from">from position 70.3</text>
    </g>
    <text x="20" y="155" class="src">Search Console · 28 days to 4 Sep vs to 22 Nov 2026</text>

    <!-- US 28-day position: 70.3 (to 4 Sep) to 4.8 (to 22 Nov); y axis inverted, position 1 at top -->
    <rect x="196" y="34" width="104" height="9.24" rx="2" fill="#5eead4" fill-opacity=".14"/>
    <text x="192" y="41" class="good" text-anchor="end">page one</text>
    <line x1="196" x2="300" y1="84" y2="84" stroke="#ffffff" stroke-opacity=".15"/>
    <path class="area" d="M200.0 78.35L202.43 77.94L210.94 70.37L219.44 60.36L227.95 55.12L234.03 53.84L236.46 51.33L244.96 50.29L253.47 49.99L261.97 48.71L270.48 46.68L278.99 44.11L296.0 40.21L296.0 84L200.0 84Z" fill="url(#sc-area)"/>
    <path class="spark" pathLength="1" d="M200.0 78.35L202.43 77.94L210.94 70.37L219.44 60.36L227.95 55.12L234.03 53.84L236.46 51.33L244.96 50.29L253.47 49.99L261.97 48.71L270.48 46.68L278.99 44.11L296.0 40.21" fill="none" stroke="url(#sc-line)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="dot">
      <text x="194" y="81.85" class="bl" text-anchor="end">70.3</text>
      <text x="296" y="28" class="bl" text-anchor="end">4.8</text>
      <circle class="ping" cx="296.0" cy="40.21" r="4" fill="#5eead4"/>
      <circle cx="296.0" cy="40.21" r="4.5" fill="#5eead4" stroke="#0f2752" stroke-width="2"/>
    </g>
  </g>
</svg>
