<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="sg-title sg-desc">
  <title id="sg-title">Page speed under 2 seconds on desktop: median desktop LCP 1.7 s, from 4.5 s. Software company (US), Lighthouse 13.5.0, 25 Sep vs 2 Oct 2026.</title>
  <desc id="sg-desc">Gauge with Google's LCP bands (good up to 2.5 s, needs improvement to 4 s, poor above 4 s) showing median desktop Largest Contentful Paint moving from 4.5 s to 1.7 s across 268 pages. Bars: median mobile LCP 14.0 s to 2.8 s across 267 pages (80.0% less time); median desktop LCP 4.5 s to 1.7 s (62.2% less time). Desktop pages at 2.5 s or less went from 3 to 266 of 268 measured. Median performance score, mobile / desktop, 56 / 59 to 76 / 87. Lighthouse 13.5.0 on every sitemap page, 25 Sep vs 2 Oct 2026.</desc>
  <defs>
    <linearGradient id="sg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081530"/>
      <stop offset="1" stop-color="#0f2752"/>
    </linearGradient>
    <radialGradient id="sg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2a78d6" stop-opacity=".30"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sg-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#9fc1ff" fill-opacity=".10"/>
    </pattern>
    <clipPath id="sg-clip"><rect width="900" height="470" rx="20"/></clipPath>
    <linearGradient id="sg-after" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .eb{font-size:13px;font-weight:700;letter-spacing:2px;fill:#8ab8ff}
    .ebo{font-size:13px;font-weight:700;letter-spacing:2px;fill:#ffb38f}
    .h1{font-size:28px;font-weight:800;letter-spacing:-.5px;fill:#ffffff}
    .sub{font-size:15px;font-weight:500;fill:#a9bddd}
    .src{font-size:13px;font-weight:500;fill:#7f93b5}
    .up{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    .pt{font-size:15px;font-weight:700;fill:#e6efff}
    .gt{font-size:13px;font-weight:600;fill:#a9bddd}
    .gv{font-size:44px;font-weight:800;letter-spacing:-1px;fill:#ffffff}
    .gl{font-size:14px;font-weight:600;fill:#d3e1f7}
    .gs{font-size:13px;font-weight:700;fill:#5eead4}
    .bef{font-size:13px;font-weight:600;fill:#a9bddd}
    .rl{font-size:15px;font-weight:700;fill:#e6efff}
    .rn{font-size:13px;font-weight:500;fill:#7f93b5}
    .bv{font-size:13px;font-weight:600;fill:#a9bddd}
    .bvi{font-size:13px;font-weight:700;fill:#e6efff}
    .av{font-size:15px;font-weight:800;fill:#5eead4}
    .pc{font-size:13px;font-weight:700;fill:#d3e1f7}
    .gd{font-size:13px;font-weight:700;fill:#5eead4}
    .kv{font-size:20px;font-weight:800;fill:#ffffff}
    .kl{font-size:13px;font-weight:500;fill:#a9bddd}
    .t1{animation-delay:.05s}.t2{animation-delay:.15s}.t3{animation-delay:.25s}.t4{animation-delay:.35s}.t5{animation-delay:1.5s}.t6{animation-delay:1.65s}
    .needle{transform-box:view-box;transform-origin:177px 318px;animation:swing 1.4s cubic-bezier(.5,0,.15,1) .5s both}
    @keyframes swing{from{transform:rotate(84.0deg)}to{transform:rotate(0deg)}}
    .bb{transform-box:fill-box;transform-origin:0 50%;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
    .b1{animation-delay:.4s}.b2{animation-delay:.55s}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    .ab{transform-box:fill-box;transform-origin:0 50%;animation:drop1 1.1s cubic-bezier(.65,0,.35,1) .8s both}
    .a2{animation-name:drop2;animation-delay:.9s}
    @keyframes drop1{0%{transform:scaleX(0)}35%{transform:scaleX(5)}100%{transform:scaleX(1)}}
    @keyframes drop2{0%{transform:scaleX(0)}35%{transform:scaleX(2.647)}100%{transform:scaleX(1)}}
    .late{animation:fade .5s ease 2s both}
    .glow{animation:glow 2.6s ease-in-out 2.4s infinite alternate}
    @keyframes glow{from{opacity:.25}to{opacity:.85}}
    @media (prefers-reduced-motion:reduce){.up,.needle,.bb,.ab,.late,.glow{animation:none}}
  </style>
  <g clip-path="url(#sg-clip)">
    <rect width="900" height="470" fill="url(#sg-bg)"/>
    <rect width="900" height="470" fill="url(#sg-dots)"/>
    <circle cx="140" cy="470" r="260" fill="url(#sg-glow)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="469" rx="19.5" fill="none" stroke="#23406f"/>
  <g class="f">
    <g class="up t1">
      <circle cx="42" cy="44" r="4.5" fill="#f0784a"/>
      <text x="56" y="49" class="ebo">SOFTWARE COMPANY (US) · LIGHTHOUSE 13.5.0, EVERY SITEMAP PAGE</text>
    </g>
    <text x="36" y="92" class="h1 up t2">Under 2 seconds on desktop: median LCP 1.7 s</text>
    <text x="36" y="120" class="sub up t3">Median time for the main content to appear (LCP), before and after the work</text>

    <!-- left: gauge -->
    <g class="up t4">
      <rect x="24" y="142" width="306" height="294" rx="16" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".11"/>
      <text x="177" y="172" class="pt" text-anchor="middle">Desktop median LCP, 268 pages</text>
      <path d="M69.0 318.0A108 108 0 0 1 145.78 214.61" stroke="#2dd4bf" stroke-width="20" fill="none" stroke-linecap="round"/><path d="M152.34 212.85A108 108 0 0 1 228.04 222.82" stroke="#fbbf24" stroke-width="20" fill="none"/><path d="M233.91 226.21A108 108 0 0 1 285.0 318.0" stroke="#f87171" stroke-width="20" fill="none" stroke-linecap="round"/>
      <text x="65" y="344" class="gt" text-anchor="middle">0</text><text x="142.32" y="192.57" class="gt" text-anchor="middle">2.5 s</text><text x="244.0" y="205.95" class="gt" text-anchor="middle">4 s</text><text x="289" y="344" class="gt" text-anchor="middle">6 s</text>
      <line x1="242.05" y1="252.95" x2="263.27" y2="231.73" stroke="#ffffff" stroke-opacity=".75" stroke-width="2.5" stroke-dasharray="3 3"/>
    </g>
    <g class="needle">
      <line x1="177" y1="318" x2="122.88" y2="251.17" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle cx="177" cy="318" r="9" fill="#ffffff"/>
    <circle cx="177" cy="318" r="4" fill="#0f2752"/>
    <g class="up t5">
      <text x="177" y="370" class="gv" text-anchor="middle">1.7 s</text>
      <text x="177" y="394" class="gs" text-anchor="middle">from 4.5 s · 62.2% less time</text>
    </g>
    <text x="269.27" y="227.73" class="bef late">before</text>

    <!-- right: before and after bars -->
    <g class="up t4">
      <rect x="350" y="142" width="526" height="294" rx="16" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".11"/>
      <text x="378" y="172" class="pt">Before (25 Sep) and after (2 Oct), median LCP</text>
    </g>
    <rect class="glow" x="488" y="186" width="58.0" height="152" fill="#5eead4" fill-opacity=".10"/>
    <line x1="546.0" x2="546.0" y1="186" y2="338" stroke="#5eead4" stroke-opacity=".85" stroke-dasharray="3 4" stroke-width="1.5"/>
    <text x="546.0" y="356" class="gd late" text-anchor="middle">Google's "good" line: 2.5 s</text>
    
      <text x="378" y="212" class="rl">Mobile</text>
      <text x="378" y="232" class="rn">267 pages</text>
      <rect class="bb b1" x="488" y="196" width="324.8" height="18" rx="5" fill="#5d6b85"/>
      <text class="late" x="804.8" y="210" text-anchor="end"><tspan class="bvi">14.0 s before</tspan></text>
      <rect class="ab a1" x="488" y="222" width="64.96" height="18" rx="5" fill="url(#sg-after)"/>
      <text class="late" x="562.96" y="236"><tspan class="av">2.8 s after</tspan><tspan class="pc" dx="10">80.0% less time</tspan></text>
      <text x="378" y="304" class="rl">Desktop</text>
      <text x="378" y="324" class="rn">268 pages</text>
      <rect class="bb b2" x="488" y="288" width="104.4" height="18" rx="5" fill="#5d6b85"/>
      <text class="late" x="600.4" y="302" text-anchor="start"><tspan class="bv">4.5 s before</tspan></text>
      <rect class="ab a2" x="488" y="314" width="39.44" height="18" rx="5" fill="url(#sg-after)"/>
      <text class="late" x="537.44" y="328"><tspan class="av">1.7 s after</tspan><tspan class="pc" dx="10">62.2% less time</tspan></text>

    <g class="up t6">
      <rect x="378" y="372" width="226" height="50" rx="12" fill="#0f766e" fill-opacity=".28" stroke="#2dd4bf" stroke-opacity=".45"/>
      <text x="394" y="394"><tspan class="kv">3 → 266</tspan></text>
      <text x="394" y="412" class="kl">desktop pages at 2.5 s or less</text>
      <rect x="616" y="372" width="242" height="50" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="632" y="394"><tspan class="kv">56 / 59 → 76 / 87</tspan></text>
      <text x="632" y="412" class="kl">performance score, mobile / desktop</text>
    </g>

    <text x="36" y="456" class="src">Lighthouse 13.5.0 on every sitemap page, 25 Sep vs 2 Oct 2026. Google rates LCP of 2.5 s or less as good.</text>
  </g>
</svg>
