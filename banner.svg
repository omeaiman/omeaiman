<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="bn-title bn-desc">
  <title id="bn-title">Ome Aiman Rasheed, Digital Growth Manager and AI Automation Engineer</title>
  <desc id="bn-desc">SEO, AEO, GEO and AI agents. Google impressions up nearly 6x in one month, 12,146 to 71,241, Google Search Console, 28 days to 20 Oct vs 28 days to 22 Nov 2026. The chart shows weekly Google impressions for a US AI sales platform, from 858 in the week of 23 Sep to 22,198 in the week of 12 Nov 2026.</desc>
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050e1d"/>
      <stop offset=".55" stop-color="#0a1c3d"/>
      <stop offset="1" stop-color="#0d2a5c"/>
    </linearGradient>
    <radialGradient id="bn-glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2a78d6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bn-glow-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bn-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1d5fbf"/>
      <stop offset="1" stop-color="#46c6d8"/>
    </linearGradient>
    <linearGradient id="bn-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ab8ff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="bn-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="bn-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#9fc1ff" fill-opacity=".16"/>
    </pattern>
    <clipPath id="bn-clip">
      <rect width="1200" height="300" rx="22"/>
    </clipPath>
  </defs>
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .eyebrow{font-size:13px;font-weight:700;letter-spacing:2.4px;fill:#8ab8ff}
    .name{font-size:54px;font-weight:800;letter-spacing:-1.5px;fill:#ffffff}
    .role{font-size:22px;font-weight:600;fill:#cfe0ff}
    .pill{fill:#11305f;stroke:#3a6cbf;stroke-opacity:.7}
    .pill-t{font-size:15px;font-weight:700;fill:#e6efff;letter-spacing:.4px}
    .proof{font-size:19px;font-weight:700;fill:#ffffff}
    .proof-src{font-size:13.5px;font-weight:500;fill:#9fb3d6}
    .panel{fill:#ffffff;fill-opacity:.045;stroke:#ffffff;stroke-opacity:.11}
    .p-h{font-size:14px;font-weight:700;fill:#e6efff}
    .p-s{font-size:11.5px;font-weight:500;fill:#8fa6cc}
    .tick{font-size:11px;font-weight:500;fill:#7f93b5}
    .val{font-size:13px;font-weight:800;fill:#5eead4}
    .grid{stroke:#ffffff;stroke-opacity:.08;stroke-dasharray:3 5}
    .base{stroke:#ffffff;stroke-opacity:.22}

    .fade{animation:fadeUp .8s cubic-bezier(.2,.8,.2,1) both}
    .d1{animation-delay:.05s}.d2{animation-delay:.18s}.d3{animation-delay:.32s}
    .d4{animation-delay:.46s}.d5{animation-delay:.9s}.d6{animation-delay:1.05s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
    .b1{animation-delay:.45s}.b2{animation-delay:.55s}.b3{animation-delay:.65s}.b4{animation-delay:.75s}
    .b5{animation-delay:.85s}.b6{animation-delay:.95s}.b7{animation-delay:1.05s}.b8{animation-delay:1.15s}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}

    .trend{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s cubic-bezier(.4,0,.2,1) 1.35s both}
    @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    .area{animation:fadeIn 1s ease 2.2s both}
    .late{animation:fadeIn .6s ease 2.6s both}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    .ping{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:ping 2.4s ease-out 2.8s infinite}
    .ping-live{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:ping 2.4s ease-out .8s infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.75}100%{transform:scale(3.4);opacity:0}}

    .glow1{animation:drift1 11s ease-in-out infinite alternate}
    .glow2{animation:drift2 13s ease-in-out infinite alternate}
    @keyframes drift1{from{transform:translate(0,0)}to{transform:translate(-60px,24px)}}
    @keyframes drift2{from{transform:translate(0,0)}to{transform:translate(70px,-20px)}}

    @media (prefers-reduced-motion:reduce){
      .fade,.bar,.trend,.area,.late,.glow1,.glow2{animation:none}
      .ping,.ping-live{animation:none;opacity:0}
    }
  </style>

  <g clip-path="url(#bn-clip)">
    <rect width="1200" height="300" fill="url(#bn-bg)"/>
    <rect width="1200" height="300" fill="url(#bn-dots)"/>
    <circle class="glow1" cx="1020" cy="30" r="280" fill="url(#bn-glow-blue)"/>
    <circle class="glow2" cx="120" cy="320" r="250" fill="url(#bn-glow-teal)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="21.5" fill="none" stroke="#2f5596" stroke-opacity=".55"/>

  <!-- Left: identity -->
  <g class="f">
    <g class="fade d1">
      <circle class="ping-live" cx="70" cy="55" r="4.5" fill="#5eead4"/>
      <circle cx="70" cy="55" r="4.5" fill="#5eead4"/>
      <text x="84" y="60" class="eyebrow">OPEN TO REMOTE WORK · US HOURS</text>
    </g>
    <text x="62" y="114" class="name fade d2">Ome Aiman Rasheed</text>
    <text x="64" y="151" class="role fade d3">Digital Growth Manager &amp; AI Automation Engineer</text>

    <g class="fade d4">
      <rect class="pill" x="64" y="170" width="64" height="32" rx="16"/>
      <text class="pill-t" x="96" y="191" text-anchor="middle">SEO</text>
      <rect class="pill" x="138" y="170" width="66" height="32" rx="16"/>
      <text class="pill-t" x="171" y="191" text-anchor="middle">AEO</text>
      <rect class="pill" x="214" y="170" width="66" height="32" rx="16"/>
      <text class="pill-t" x="247" y="191" text-anchor="middle">GEO</text>
      <rect class="pill" x="290" y="170" width="110" height="32" rx="16"/>
      <text class="pill-t" x="345" y="191" text-anchor="middle">AI Agents</text>
    </g>

    <g class="fade d5">
      <circle cx="78" cy="241" r="14" fill="#0f766e"/>
      <path d="M71.5 245.5l6.5-6.5 6.5 6.5M78 239v10" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-3)"/>
      <text x="102" y="248" class="proof">Google impressions up nearly 6x in one month</text>
    </g>
    <text x="102" y="271" class="proof-src fade d6">12,146 → 71,241 · Google Search Console, 28-day windows, Oct to Nov 2026</text>
  </g>

  <!-- Right: weekly impressions chart (real readings, AI sales platform) -->
  <g class="f">
    <rect class="panel fade d3" x="770" y="34" width="384" height="232" rx="16"/>
    <g class="fade d4">
      <text x="792" y="62" class="p-h">Weekly Google impressions</text>
      <text x="792" y="80" class="p-s">AI sales platform (US) · 23 Sep to 18 Nov 2026</text>
    </g>

    <line class="grid" x1="792" x2="1132" y1="114" y2="114"/>
    <line class="grid" x1="792" x2="1132" y1="154" y2="154"/>
    <line class="grid" x1="792" x2="1132" y1="194" y2="194"/>
    <line class="base" x1="792" x2="1132" y1="234" y2="234"/>

    <!-- 858, 2501, 3725, 5208, 9508, 12909, 18661, 22198 scaled to 120 px -->
    <rect class="bar b1" x="802.25" y="229.36" width="22" height="4.64" rx="3" fill="url(#bn-bar)"/>
    <rect class="bar b2" x="844.75" y="220.48" width="22" height="13.52" rx="3" fill="url(#bn-bar)"/>
    <rect class="bar b3" x="887.25" y="213.86" width="22" height="20.14" rx="4" fill="url(#bn-bar)"/>
    <rect class="bar b4" x="929.75" y="205.85" width="22" height="28.15" rx="4" fill="url(#bn-bar)"/>
    <rect class="bar b5" x="972.25" y="182.60" width="22" height="51.40" rx="4" fill="url(#bn-bar)"/>
    <rect class="bar b6" x="1014.75" y="164.21" width="22" height="69.79" rx="4" fill="url(#bn-bar)"/>
    <rect class="bar b7" x="1057.25" y="133.12" width="22" height="100.88" rx="4" fill="url(#bn-bar)"/>
    <rect class="bar b8" x="1099.75" y="114.00" width="22" height="120.00" rx="4" fill="url(#bn-bar)"/>

    <path class="area" d="M813.25 229.36L855.75 220.48L898.25 213.86L940.75 205.85L983.25 182.6L1025.75 164.21L1068.25 133.12L1110.75 114L1110.75 234L813.25 234Z" fill="url(#bn-area)"/>
    <path class="trend" pathLength="1" d="M813.25 229.36L855.75 220.48L898.25 213.86L940.75 205.85L983.25 182.6L1025.75 164.21L1068.25 133.12L1110.75 114" fill="none" stroke="url(#bn-line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g class="late">
      <circle class="ping" cx="1110.75" cy="114" r="5" fill="#5eead4"/>
      <circle cx="1110.75" cy="114" r="5.5" fill="#5eead4" stroke="#0a1c3d" stroke-width="2"/>
      <text x="1098" y="104" class="val" text-anchor="end">22,198</text>
    </g>

    <g class="fade d5">
      <text x="813.25" y="253" class="tick" text-anchor="middle">23 Sep</text>
      <text x="983.25" y="253" class="tick" text-anchor="middle">21 Oct</text>
      <text x="1110.75" y="253" class="tick" text-anchor="middle">12 Nov</text>
    </g>
  </g>
</svg>
