<svg xmlns="http://www.w3.org/2000/svg" width="320" height="168" viewBox="0 0 320 168" role="img" aria-labelledby="sl-title">
  <title id="sl-title">2.8 seconds median mobile load time (LCP) across 267 pages for a US software company, 80.0% lower than 14.0 seconds. Lighthouse 13.5.0, 25 Sep vs 2 Oct 2026.</title>
  <defs>
    <linearGradient id="sl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081530"/>
      <stop offset="1" stop-color="#0f2752"/>
    </linearGradient>
    <linearGradient id="sl-after" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .tag{font-size:10.5px;font-weight:700;letter-spacing:1.2px;fill:#ffb38f}
    .val{font-size:42px;font-weight:800;letter-spacing:-1px;fill:#ffffff}
    .lab{font-size:14px;font-weight:600;fill:#d3e1f7}
    .dl{font-size:12.5px;font-weight:800;fill:#5eead4}
    .from{font-size:12px;font-weight:500;fill:#a9bddd}
    .src{font-size:11px;font-weight:500;fill:#7f93b5}
    .cap{font-size:9.5px;font-weight:600;fill:#7f93b5;letter-spacing:.6px}
    .bl{font-size:9.5px;font-weight:700;fill:#a9bddd}
    .good{font-size:8.5px;font-weight:700;fill:#5eead4}
    .up{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
    .u2{animation-delay:.12s}.u3{animation-delay:.24s}.u4{animation-delay:.36s}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .before{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) .3s both}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .after{transform-box:fill-box;transform-origin:50% 100%;animation:drop 1.4s cubic-bezier(.65,0,.35,1) .9s both}
    @keyframes drop{0%{transform:scaleY(0)}30%{transform:scaleY(5)}100%{transform:scaleY(1)}}
    .late{animation:fade .5s ease 2.2s both}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.up,.before,.after,.late{animation:none}}
  </style>
  <rect x=".5" y=".5" width="319" height="167" rx="16" fill="url(#sl-bg)" stroke="#23406f"/>
  <g class="f">
    <g class="up">
      <circle cx="24" cy="26" r="4" fill="#f0784a"/>
      <text x="34" y="30" class="tag">SOFTWARE COMPANY (US)</text>
    </g>
    <text x="20" y="80" class="val up u2">2.8 s</text>
    <text x="20" y="103" class="lab up u3">median mobile load time (LCP)</text>
    <g class="up u4">
      <rect x="20" y="113" width="94" height="22" rx="11" fill="#0f766e" fill-opacity=".38" stroke="#2dd4bf" stroke-opacity=".55"/>
      <text x="67" y="128.5" class="dl" text-anchor="middle">80.0% lower</text>
      <text x="123" y="128.5" class="from">from 14.0 s, 267 pages</text>
    </g>
    <text x="20" y="155" class="src">Lighthouse 13.5.0 · 25 Sep vs 2 Oct 2026</text>

    <!-- Median mobile LCP: before 14.0 s, after 2.8 s; 2.5 s good line (scaled 3.6 px per second) -->
    <line x1="232" x2="302" y1="78" y2="78" stroke="#ffffff" stroke-opacity=".15"/>
    <rect class="before" x="240" y="27.6" width="22" height="50.4" rx="4" fill="#5d6b85"/>
    <rect class="after" x="274" y="67.92" width="22" height="10.08" rx="3" fill="url(#sl-after)"/>
    <line x1="204" x2="300" y1="69" y2="69" stroke="#5eead4" stroke-opacity=".7" stroke-dasharray="2 3"/>
    <g class="late">
      <text x="251" y="89" class="bl" text-anchor="middle">14.0 s</text>
      <text x="285" y="89" class="bl" text-anchor="middle">2.8 s</text>
      <text x="236" y="65" class="good" text-anchor="end">2.5 s good</text>
    </g>
  </g>
</svg>
