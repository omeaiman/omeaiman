<svg xmlns="http://www.w3.org/2000/svg" width="360" height="64" viewBox="0 0 360 64" role="img" aria-labelledby="pb-title">
  <title id="pb-title">View my portfolio: live results, charts and case studies at omeaiman.github.io</title>
  <defs>
    <linearGradient id="pb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d63d1"/>
      <stop offset="1" stop-color="#0b6f68"/>
    </linearGradient>
    <linearGradient id="pb-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pb-clip">
      <rect width="360" height="64" rx="16"/>
    </clipPath>
  </defs>
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .main{font-size:19px;font-weight:800;fill:#ffffff;letter-spacing:-.2px}
    .sub{font-size:12.5px;font-weight:600;fill:#dbeafe}
    .shine{animation:shine 4.2s cubic-bezier(.4,0,.2,1) 1s infinite}
    @keyframes shine{0%{transform:translateX(-140px) skewX(-20deg)}45%,100%{transform:translateX(520px) skewX(-20deg)}}
    .arrow{animation:nudge 1.8s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
    .b{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
    .b1{animation-delay:.2s}.b2{animation-delay:.32s}.b3{animation-delay:.44s}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @media (prefers-reduced-motion:reduce){.shine,.arrow,.b{animation:none}.shine{opacity:0}}
  </style>
  <g clip-path="url(#pb-clip)">
    <rect width="360" height="64" fill="url(#pb-bg)"/>
    <rect class="shine" x="0" y="-10" width="90" height="84" fill="url(#pb-shine)" transform="translate(-140,0)"/>
  </g>
  <rect x=".75" y=".75" width="358.5" height="62.5" rx="15.25" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.5"/>

  <rect x="14" y="14" width="36" height="36" rx="10" fill="#ffffff" fill-opacity=".16"/>
  <rect class="b b1" x="21.5" y="33" width="5" height="10" rx="2" fill="#ffffff"/>
  <rect class="b b2" x="29.5" y="27" width="5" height="16" rx="2" fill="#ffffff"/>
  <rect class="b b3" x="37.5" y="21" width="5" height="22" rx="2" fill="#ffffff"/>

  <g class="f">
    <text x="62" y="30" class="main">View my portfolio</text>
    <text x="62" y="48" class="sub">Results, charts, case studies</text>
  </g>

  <circle cx="324" cy="32" r="18" fill="#ffffff"/>
  <path class="arrow" d="M316 32h15M325 25.5l6.5 6.5-6.5 6.5" fill="none" stroke="#0b5fae" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
