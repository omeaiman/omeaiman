<svg xmlns="http://www.w3.org/2000/svg" width="900" height="516" viewBox="0 0 900 516" role="img" aria-labelledby="ts-title ts-desc">
  <title id="ts-title">Tech and tools: build and automate, measure, publish and design</title>
  <desc id="ts-desc">Build and automate: Python, Node.js, Claude Code, MCP integrations, GitHub. Measure: Google Search Console, Google Analytics 4, Semrush, Lighthouse, Bing Webmaster Tools. Publish and design: WordPress, Notion, Figma, Canva, JSON-LD schema and llms.txt.</desc>
  <defs>
    <linearGradient id="ts-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081530"/>
      <stop offset="1" stop-color="#0f2752"/>
    </linearGradient>
    <radialGradient id="ts-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2a78d6" stop-opacity=".30"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ts-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#9fc1ff" fill-opacity=".10"/>
    </pattern>
    <clipPath id="ts-clip"><rect width="900" height="516" rx="20"/></clipPath></defs>
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .eb{font-size:13px;font-weight:700;letter-spacing:2px;fill:#8ab8ff}
    .ebo{font-size:13px;font-weight:700;letter-spacing:2px;fill:#ffb38f}
    .h1{font-size:28px;font-weight:800;letter-spacing:-.5px;fill:#ffffff}
    .sub{font-size:15px;font-weight:500;fill:#a9bddd}
    .src{font-size:13px;font-weight:500;fill:#7f93b5}
    .up{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    .gh{font-size:17px;font-weight:800;fill:#ffffff}
    .mono{font-weight:800;letter-spacing:-.2px}
    .tn{font-size:15px;font-weight:700;fill:#ffffff}
    .td{font-size:13px;font-weight:500;fill:#a9bddd}
    .t1{animation-delay:.05s}.t2{animation-delay:.15s}
    .g1{animation-delay:0.20s}.g2{animation-delay:0.32s}.g3{animation-delay:0.44s}
    .k1{animation-delay:0.40s}.k2{animation-delay:0.47s}.k3{animation-delay:0.54s}.k4{animation-delay:0.61s}.k5{animation-delay:0.68s}.k6{animation-delay:0.75s}.k7{animation-delay:0.82s}.k8{animation-delay:0.89s}.k9{animation-delay:0.96s}.k10{animation-delay:1.03s}.k11{animation-delay:1.10s}.k12{animation-delay:1.17s}.k13{animation-delay:1.24s}.k14{animation-delay:1.31s}.k15{animation-delay:1.38s}
    @media (prefers-reduced-motion:reduce){.up{animation:none}}
  </style>
