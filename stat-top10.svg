<svg xmlns="http://www.w3.org/2000/svg" width="320" height="168" viewBox="0 0 320 168" role="img" aria-labelledby="st-title">
  <title id="st-title">712 queries ranking in Google's top 10 for a US AI sales platform, up 718% from 87 one month earlier. Google Search Console, 28 days to 22 Nov 2026.</title>
  <defs>
    <linearGradient id="st-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081530"/>
      <stop offset="1" stop-color="#0f2752"/>
    </linearGradient>
    <linearGradient id="st-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1d5fbf"/>
      <stop offset="1" stop-color="#46c6d8"/>
    </linearGradient>
  </defs>
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .tag{font-size:10.5px;font-weight:700;letter-spacing:1.2px;fill:#8ab8ff}
    .val{font-size:42px;font-weight:800;letter-spacing:-1px;fill:#ffffff}
    .lab{font-size:14px;font-weight:600;fill:#d3e1f7}
    .dl{font-size:12.5px;font-weight:800;fill:#5eead4}
    .from{font-size:12px;font-weight:500;fill:#a9bddd}
    .src{font-size:11px;font-weight:500;fill:#7f93b5}
    .cap{font-size:9.5px;font-weight:600;fill:#7f93b5;letter-spacing:.6px}
    .bl{font-size:9.5px;font-weight:700;fill:#a9bddd}
    .up{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
    .u2{animation-delay:.12s}.u3{animation-delay:.24s}.u4{animation-delay:.36s}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
    .b1{animation-delay:.35s}.b2{animation-delay:.5s}.b3{animation-delay:.65s}.b4{animation-delay:.8s}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .late{animation:fade .5s ease 1.5s both}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    .glow{animation:glow 2.6s ease-in-out 1.8s infinite alternate}
    @keyframes glow{from{opacity:.35}to{opacity:.9}}
    @media (prefers-reduced-motion:reduce){.up,.bar,.late,.glow{animation:none}}
  </style>
  <rect x=".5" y=".5" width="319" height="167" rx="16" fill="url(#st-bg)" stroke="#23406f"/>
  <g class="f">
    <g class="up">
      <circle cx="24" cy="26" r="4" fill="#4b94ec"/>
      <text x="34" y="30" class="tag">AI SALES PLATFORM (US)</text>
    </g>
    <text x="20" y="80" class="val up u2">712</text>
    <text x="20" y="103" class="lab up u3">queries in Google's top 10</text>
    <g class="up u4">
      <rect x="20" y="113" width="62" height="22" rx="11" fill="#0f766e" fill-opacity=".38" stroke="#2dd4bf" stroke-opacity=".55"/>
      <text x="51" y="128.5" class="dl" text-anchor="middle">+718%</text>
      <text x="91" y="128.5" class="from">from 87 a month earlier</text>
    </g>
    <text x="20" y="155" class="src">Google Search Console · 28 days to 22 Nov 2026</text>

    <!-- Top-10 queries at each checkpoint: 11 / 87 / 265 / 712 (scaled to 46 px) -->
    <line x1="196" x2="300" y1="84" y2="84" stroke="#ffffff" stroke-opacity=".15"/>
    <rect class="bar b1" x="200" y="83.29" width="18" height="0.71" rx="1" fill="url(#st-bar)"/>
    <rect class="bar b2" x="226" y="78.38" width="18" height="5.62" rx="2" fill="url(#st-bar)"/>
    <rect class="bar b3" x="252" y="66.88" width="18" height="17.12" rx="3" fill="url(#st-bar)"/>
    <rect class="glow" x="276" y="34" width="22" height="52" rx="5" fill="#46c6d8" fill-opacity=".18"/>
    <rect class="bar b4" x="278" y="38" width="18" height="46" rx="3" fill="url(#st-bar)"/>
    <text x="287" y="96" class="bl late" text-anchor="middle">712</text>
    <text x="235" y="96" class="bl late" text-anchor="middle">87</text>
  </g>
</svg>
